<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>問題 - 2級土木施工管理技士</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/notification.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header header-compact">
            <a href="questions.html" class="back-button">
                <i class="fas fa-arrow-left"></i> 一覧へ戻る
            </a>
            <div class="header-title-group">
                <i class="fas fa-hard-hat header-icon-small"></i>
                <h1 id="questionTitle">問題</h1>
            </div>
        </header>

        <main class="main-content question-page">
            <!-- 問題情報バー -->
            <div class="question-info-bar">
                <div class="info-left">
                    <span class="badge badge-year" id="yearBadge">令和6年度</span>
                    <span class="badge badge-category" id="categoryBadge">土工</span>
                    <span class="badge badge-difficulty" id="difficultyBadge">A</span>
                </div>
                <div class="info-right">
                    <span class="question-number" id="questionNumber">問題 1 / 250</span>
                </div>
            </div>

            <!-- 問題カード -->
            <div class="question-card">
                <div class="question-header">
                    <h2 id="questionTitleText">問題タイトル</h2>
                </div>
                
                <div class="question-content">
                    <p id="questionText" class="question-text">
                        問題文がここに表示されます
                    </p>
                    
                    <div id="questionImage" class="question-image">
                        <!-- 問題図がある場合はここに表示 -->
                    </div>
                </div>

                <!-- 選択肢 -->
                <div class="choices-container" id="choicesContainer">
                    <!-- 選択肢がJavaScriptで動的に生成されます -->
                </div>

                <!-- 回答ボタン -->
                <div class="action-buttons" id="submitButtonContainer">
                    <button id="submitAnswer" class="btn btn-primary" disabled>
                        <i class="fas fa-check-circle"></i>
                        回答を確定
                    </button>
                </div>

                <!-- 解説エリア（回答後に表示） -->
                <div id="explanationArea" class="explanation-area" style="display: none;">
                    <div class="result-banner" id="resultBanner">
                        <div class="result-icon" id="resultIcon"></div>
                        <h3 id="resultText"></h3>
                    </div>

                    <div class="explanation-content">
                        <h4><i class="fas fa-lightbulb"></i> 解説</h4>
                        <div id="mainExplanation" class="main-explanation"></div>
                        
                        <div class="choices-explanation">
                            <h5><i class="fas fa-list-ul"></i> 各選択肢の解説</h5>
                            <div id="choicesExplanation"></div>
                        </div>

                        <!-- 参考図 -->
                        <div id="referenceImagesArea" style="display: none;">
                            <h5><i class="fas fa-images"></i> 参考図</h5>
                            <div id="referenceImages" class="reference-images"></div>
                        </div>

                        <!-- 法令参照 -->
                        <div id="lawReferencesArea" style="display: none;">
                            <h5><i class="fas fa-gavel"></i> 関連法規・基準</h5>
                            <div id="lawReferences" class="law-references"></div>
                        </div>

                        <!-- 学習のコツ -->
                        <div id="tipArea" style="display: none;">
                            <div class="tip-box">
                                <i class="fas fa-star"></i>
                                <span id="tipContent"></span>
                            </div>
                        </div>
                    </div>

                    <!-- 次の問題へのナビゲーション -->
                    <div class="navigation-buttons">
                        <button id="prevQuestion" class="btn btn-outline">
                            <i class="fas fa-chevron-left"></i>
                            前の問題
                        </button>
                        <button id="nextQuestion" class="btn btn-primary">
                            次の問題
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 進捗表示 -->
            <div class="progress-indicator">
                <div class="progress-info">
                    <span>学習進捗</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2025 2級土木施工管理技士 過去問題集</p>
                <p class="footer-sub">Produced by NL-DG Co., Ltd. & Narukawa Co., Ltd.</p>
            </div>
        </footer>
    </div>

    <!-- 通知エリア -->
    <div id="notification" class="notification"></div>

    <script src="js/common.js"></script>
    <script src="js/question.js"></script>
</body>
</html>
