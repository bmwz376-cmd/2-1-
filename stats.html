<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>学習統計 - 2級土木施工管理技士</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header header-compact">
            <a href="index.html" class="back-button">
                <i class="fas fa-arrow-left"></i> ホームへ戻る
            </a>
            <div class="header-title-group">
                <i class="fas fa-chart-line header-icon-small"></i>
                <h1>学習統計</h1>
            </div>
        </header>

        <main class="main-content stats-page">
            <!-- 全体統計 -->
            <section class="stats-section">
                <h2><i class="fas fa-tachometer-alt"></i> 全体の学習状況</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-icon-large">
                            <i class="fas fa-book-open"></i>
                        </div>
                        <div class="stat-details">
                            <h3 id="totalAnswered">0</h3>
                            <p>解答済み問題</p>
                            <span class="stat-sub">/ 250 問</span>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-icon-large">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-details">
                            <h3 id="totalCorrect">0</h3>
                            <p>正解数</p>
                            <span class="stat-sub" id="accuracyRate">正答率: 0%</span>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-icon-large">
                            <i class="fas fa-times-circle"></i>
                        </div>
                        <div class="stat-details">
                            <h3 id="totalIncorrect">0</h3>
                            <p>不正解数</p>
                            <span class="stat-sub" id="incorrectRate">0%</span>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-icon-large">
                            <i class="fas fa-fire"></i>
                        </div>
                        <div class="stat-details">
                            <h3 id="maxStreak">0</h3>
                            <p>最高連続正解</p>
                            <span class="stat-sub">現在: <span id="currentStreak">0</span>問</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 年度別統計 -->
            <section class="stats-section">
                <h2><i class="fas fa-calendar-alt"></i> 年度別の正答率</h2>
                <div class="year-stats" id="yearStats">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </section>

            <!-- 分野別統計 -->
            <section class="stats-section">
                <h2><i class="fas fa-layer-group"></i> 分野別の正答率</h2>
                <div class="category-stats" id="categoryStats">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </section>

            <!-- 重要度別統計 -->
            <section class="stats-section">
                <h2><i class="fas fa-signal"></i> 重要度別の正答率</h2>
                <div class="difficulty-stats" id="difficultyStats">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </section>

            <!-- 苦手分野 -->
            <section class="stats-section">
                <h2><i class="fas fa-exclamation-triangle"></i> 復習が必要な問題</h2>
                <div class="weak-areas" id="weakAreas">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </section>

            <!-- アクションボタン -->
            <div class="action-buttons">
                <button id="reviewIncorrect" class="btn btn-primary">
                    <i class="fas fa-redo"></i>
                    間違えた問題を復習
                </button>
                <button id="resetProgress" class="btn btn-outline btn-danger">
                    <i class="fas fa-trash-alt"></i>
                    学習履歴をリセット
                </button>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2025 2級土木施工管理技士 過去問題集</p>
                <p class="footer-sub">Produced by NL-DG Co., Ltd. & Narukawa Co., Ltd.</p>
            </div>
        </footer>
    </div>

    <script src="js/common.js"></script>
    <script src="js/stats.js"></script>
</body>
</html>
