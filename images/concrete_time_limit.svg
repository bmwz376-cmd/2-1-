<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <!-- Background -->
  <rect width="600" height="350" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">
    コンクリート打込み時間の制限
  </text>
  
  <!-- Temperature icon and condition 1 -->
  <g transform="translate(100, 80)">
    <rect width="200" height="100" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/>
    
    <!-- Thermometer icon -->
    <g transform="translate(30, 30)">
      <rect x="0" y="0" width="8" height="40" fill="#60a5fa" stroke="#3b82f6" stroke-width="1"/>
      <circle cx="4" cy="48" r="8" fill="#60a5fa" stroke="#3b82f6" stroke-width="1"/>
    </g>
    
    <text x="100" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">
      外気温 &lt; 25℃
    </text>
    <text x="100" y="70" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#10b981">
      120分以内
    </text>
  </g>
  
  <!-- Temperature icon and condition 2 -->
  <g transform="translate(320, 80)">
    <rect width="200" height="100" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="8"/>
    
    <!-- Thermometer icon (hot) -->
    <g transform="translate(30, 30)">
      <rect x="0" y="0" width="8" height="40" fill="#f87171" stroke="#ef4444" stroke-width="1"/>
      <circle cx="4" cy="48" r="8" fill="#f87171" stroke="#ef4444" stroke-width="1"/>
    </g>
    
    <text x="100" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">
      外気温 ≥ 25℃
    </text>
    <text x="100" y="70" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#f59e0b">
      90分以内
    </text>
  </g>
  
  <!-- Timeline illustration -->
  <g transform="translate(50, 220)">
    <text x="250" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">
      練混ぜ開始から打込み終了まで
    </text>
    
    <!-- Timeline arrow -->
    <line x1="50" y1="40" x2="450" y2="40" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- Start point -->
    <circle cx="50" cy="40" r="6" fill="#10b981"/>
    <text x="50" y="65" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">
      練混ぜ開始
    </text>
    
    <!-- 90min mark -->
    <line x1="230" y1="30" x2="230" y2="50" stroke="#f59e0b" stroke-width="2"/>
    <text x="230" y="75" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#f59e0b" font-weight="bold">
      90分
    </text>
    <text x="230" y="90" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">
      (25℃以上)
    </text>
    
    <!-- 120min mark -->
    <line x1="350" y1="30" x2="350" y2="50" stroke="#10b981" stroke-width="2"/>
    <text x="350" y="75" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#10b981" font-weight="bold">
      120分
    </text>
    <text x="350" y="90" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">
      (25℃未満)
    </text>
    
    <!-- End point -->
    <circle cx="450" cy="40" r="6" fill="#ef4444"/>
    <text x="450" y="65" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">
      打込み終了
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>
</svg>
