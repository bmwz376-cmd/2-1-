<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" width="650" height="400">
  <!-- Background -->
  <rect width="650" height="400" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="325" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">
    監理技術者配置の基準（建設業法第26条）
  </text>
  
  <!-- Main box -->
  <g transform="translate(50, 60)">
    <rect width="550" height="120" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="10"/>
    
    <text x="275" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e40af">
      発注者から直接請負った建設工事
    </text>
    
    <text x="275" y="55" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#64748b">
      下請契約の請負代金の総額が下記以上の場合
    </text>
    
    <!-- Two conditions -->
    <g transform="translate(50, 70)">
      <!-- Civil engineering -->
      <rect width="220" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="6"/>
      <text x="110" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">
        土木一式工事
      </text>
      <text x="110" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#10b981">
        4,500万円以上
      </text>
    </g>
    
    <g transform="translate(280, 70)">
      <!-- Architecture -->
      <rect width="220" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="6"/>
      <text x="110" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b45309">
        建築一式工事
      </text>
      <text x="110" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#dc2626">
        7,000万円以上
      </text>
    </g>
  </g>
  
  <!-- Example diagram -->
  <g transform="translate(50, 210)">
    <text x="275" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">
      例：土木一式工事の場合
    </text>
    
    <!-- Owner box -->
    <g transform="translate(0, 20)">
      <rect width="550" height="50" fill="#f0fdf4" stroke="#10b981" stroke-width="2" rx="8"/>
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#15803d">
        発注者
      </text>
      <text x="480" y="30" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
        工事総額: 1億円
      </text>
    </g>
    
    <!-- Arrow down -->
    <line x1="275" y1="75" x2="275" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#arrowDown)"/>
    
    <!-- Prime contractor box -->
    <g transform="translate(0, 95)">
      <rect width="550" height="50" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="8"/>
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">
        元請業者（監理技術者配置必要）
      </text>
      <text x="380" y="30" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
        下請総額: 5,000万円
      </text>
    </g>
    
    <!-- Arrow down -->
    <line x1="150" y1="150" x2="150" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowDown)"/>
    <line x1="400" y1="150" x2="400" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowDown)"/>
    
    <!-- Subcontractors -->
    <g transform="translate(25, 170)">
      <rect width="200" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="6"/>
      <text x="100" y="15" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">
        下請業者A
      </text>
      <text x="100" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">
        3,000万円
      </text>
    </g>
    
    <g transform="translate(275, 170)">
      <rect width="200" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="6"/>
      <text x="100" y="15" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">
        下請業者B
      </text>
      <text x="100" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">
        2,000万円
      </text>
    </g>
  </g>
  
  <!-- Note -->
  <g transform="translate(50, 370)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      ※ 下請総額 = 下請業者A + 下請業者B = 5,000万円 ≥ 4,500万円 → 監理技術者の配置が必要
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#64748b"/>
    </marker>
  </defs>
</svg>
