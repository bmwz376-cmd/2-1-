<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <!-- Background -->
  <rect width="700" height="400" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">
    ネットワーク工程表とクリティカルパス
  </text>
  
  <!-- Start Node -->
  <g id="node-start">
    <circle cx="50" cy="150" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
    <text x="50" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
      開始
    </text>
  </g>
  
  <!-- Node A -->
  <g id="node-a">
    <circle cx="200" cy="100" r="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="200" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">
      A
    </text>
    <text x="200" y="115" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#64748b">
      5日
    </text>
  </g>
  
  <!-- Node B -->
  <g id="node-b">
    <circle cx="200" cy="200" r="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="200" y="200" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b45309">
      B
    </text>
    <text x="200" y="215" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#64748b">
      8日
    </text>
  </g>
  
  <!-- Node C -->
  <g id="node-c">
    <circle cx="370" cy="100" r="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="370" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">
      C
    </text>
    <text x="370" y="115" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#64748b">
      3日
    </text>
  </g>
  
  <!-- Node D -->
  <g id="node-d">
    <circle cx="370" cy="200" r="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="370" y="200" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b45309">
      D
    </text>
    <text x="370" y="215" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#64748b">
      6日
    </text>
  </g>
  
  <!-- End Node -->
  <g id="node-end">
    <circle cx="540" cy="150" r="25" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
    <text x="540" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
      完了
    </text>
  </g>
  
  <!-- Arrows - Normal paths -->
  <defs>
    <marker id="arrowNormal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrowCritical" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>
  
  <!-- Start to A (normal) -->
  <line x1="75" y1="140" x2="170" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowNormal)"/>
  
  <!-- Start to B (CRITICAL) -->
  <line x1="75" y1="160" x2="170" y2="190" stroke="#ef4444" stroke-width="4" marker-end="url(#arrowCritical)"/>
  <text x="122" y="185" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ef4444">
    Critical
  </text>
  
  <!-- A to C (normal) -->
  <line x1="230" y1="100" x2="340" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowNormal)"/>
  
  <!-- B to D (CRITICAL) -->
  <line x1="230" y1="200" x2="340" y2="200" stroke="#ef4444" stroke-width="4" marker-end="url(#arrowCritical)"/>
  <text x="285" y="190" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ef4444">
    Critical
  </text>
  
  <!-- C to End (normal) -->
  <line x1="400" y1="110" x2="515" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowNormal)"/>
  
  <!-- D to End (CRITICAL) -->
  <line x1="400" y1="190" x2="515" y2="160" stroke="#ef4444" stroke-width="4" marker-end="url(#arrowCritical)"/>
  <text x="457" y="185" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ef4444">
    Critical
  </text>
  
  <!-- Legend -->
  <g transform="translate(50, 300)">
    <rect width="600" height="80" fill="white" stroke="#e2e8f0" stroke-width="1" rx="8"/>
    
    <text x="300" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">
      クリティカルパス（最長経路）
    </text>
    
    <g transform="translate(80, 40)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#ef4444" stroke-width="4"/>
      <text x="70" y="5" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
        クリティカルパス: 開始 → B(8日) → D(6日) → 完了 = 14日
      </text>
    </g>
    
    <g transform="translate(80, 65)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#94a3b8" stroke-width="2"/>
      <text x="70" y="5" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
        通常経路: 開始 → A(5日) → C(3日) → 完了 = 8日（余裕あり）
      </text>
    </g>
  </g>
</svg>
