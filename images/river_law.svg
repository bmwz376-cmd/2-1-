<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 450">
  <!-- 背景 -->
  <rect width="750" height="450" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="375" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">河川法の基本</text>
  
  <!-- 河川の分類 -->
  <g id="river_classification">
    <text x="200" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3498db">河川の分類</text>
    
    <!-- 一級河川 -->
    <rect x="50" y="80" width="130" height="80" fill="#d6eaf8" stroke="#3498db" stroke-width="3" rx="5"/>
    <text x="115" y="105" font-family="Arial, sans-serif" font-size="14" fill="#3498db" font-weight="bold" text-anchor="middle">一級河川</text>
    <text x="115" y="125" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">国土保全上</text>
    <text x="115" y="142" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">重要な河川</text>
    <text x="115" y="157" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" text-anchor="middle">（国が管理）</text>
    
    <!-- 二級河川 -->
    <rect x="200" y="80" width="130" height="80" fill="#d5f4e6" stroke="#27ae60" stroke-width="3" rx="5"/>
    <text x="265" y="105" font-family="Arial, sans-serif" font-size="14" fill="#27ae60" font-weight="bold" text-anchor="middle">二級河川</text>
    <text x="265" y="125" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">公共の利害に</text>
    <text x="265" y="142" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">重要な河川</text>
    <text x="265" y="157" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" text-anchor="middle">（都道府県管理）</text>
    
    <!-- 準用河川 -->
    <rect x="350" y="80" width="130" height="80" fill="#fef5e7" stroke="#f39c12" stroke-width="3" rx="5"/>
    <text x="415" y="105" font-family="Arial, sans-serif" font-size="14" fill="#f39c12" font-weight="bold" text-anchor="middle">準用河川</text>
    <text x="415" y="125" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">市町村が指定</text>
    <text x="415" y="142" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">する河川</text>
    <text x="415" y="157" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" text-anchor="middle">（市町村管理）</text>
  </g>
  
  <!-- 河川区域と許可 -->
  <g id="river_area_permission">
    <text x="600" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#e74c3c">河川区域での行為</text>
    
    <rect x="520" y="80" width="200" height="80" fill="#fadbd8" stroke="#e74c3c" stroke-width="3" rx="5"/>
    <text x="620" y="105" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50" font-weight="bold" text-anchor="middle">工作物の新築等</text>
    <text x="620" y="128" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold" text-anchor="middle">河川管理者の</text>
    <text x="620" y="148" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold" text-anchor="middle">許可が必要</text>
    <text x="620" y="163" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d" text-anchor="middle">（河川法第26条）</text>
  </g>
  
  <!-- 河川区域の図解 -->
  <g id="river_area_diagram">
    <text x="375" y="200" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#9b59b6">河川区域と河川保全区域</text>
    
    <!-- 断面図 -->
    <rect x="50" y="220" width="650" height="200" fill="#85c1e9" opacity="0.1"/>
    
    <!-- 堤防 -->
    <path d="M 50 370 L 100 320 L 200 320 L 200 370 Z" fill="#8b7355" stroke="#6b5843" stroke-width="2"/>
    <path d="M 550 370 L 500 320 L 600 320 L 600 370 Z" fill="#8b7355" stroke="#6b5843" stroke-width="2"/>
    
    <!-- 河川 -->
    <rect x="200" y="350" width="300" height="70" fill="#85c1e9" stroke="#5dade2" stroke-width="2"/>
    <text x="350" y="390" font-family="Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">河川</text>
    
    <!-- 河川区域 -->
    <line x1="100" y1="310" x2="100" y2="295" stroke="#e74c3c" stroke-width="2"/>
    <line x1="500" y1="310" x2="500" y2="295" stroke="#e74c3c" stroke-width="2"/>
    <line x1="100" y1="303" x2="500" y2="303" stroke="#e74c3c" stroke-width="3" marker-start="url(#arrowleft)" marker-end="url(#arrowright)"/>
    <text x="300" y="290" font-family="Arial, sans-serif" font-size="13" fill="#e74c3c" font-weight="bold" text-anchor="middle">河川区域</text>
    <text x="300" y="305" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" text-anchor="middle">（許可が必要）</text>
    
    <!-- 河川保全区域 -->
    <line x1="80" y1="250" x2="80" y2="235" stroke="#9b59b6" stroke-width="2"/>
    <line x1="520" y1="250" x2="520" y2="235" stroke="#9b59b6" stroke-width="2"/>
    <line x1="80" y1="243" x2="520" y2="243" stroke="#9b59b6" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="300" y="230" font-family="Arial, sans-serif" font-size="13" fill="#9b59b6" font-weight="bold" text-anchor="middle">河川保全区域</text>
    <text x="300" y="245" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6" text-anchor="middle">（河川管理施設を保全）</text>
    
    <!-- 河川占用 -->
    <rect x="250" y="335" width="100" height="15" fill="#f39c12" opacity="0.5" stroke="#d68910" stroke-width="2"/>
    <text x="300" y="347" font-family="Arial, sans-serif" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">占用許可必要</text>
  </g>
  
  <!-- 矢印マーカー -->
  <defs>
    <marker id="arrowleft" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <polygon points="10 0, 10 10, 0 5" fill="#e74c3c" />
    </marker>
    <marker id="arrowright" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#e74c3c" />
    </marker>
  </defs>
</svg>
