<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Title -->
  <text x="400" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    モルタル配合比とセメント使用量
  </text>
  
  <!-- Mortar Mix Ratio Diagram -->
  <g id="mix-ratio">
    <rect x="50" y="60" width="700" height="180" fill="#ecf0f1" stroke="#34495e" stroke-width="2" rx="5"/>
    
    <!-- Title -->
    <text x="400" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      配合比 1:3 (セメント:砂)
    </text>
    
    <!-- Cement Part -->
    <rect x="100" y="120" width="120" height="80" fill="#95a5a6" stroke="#34495e" stroke-width="2"/>
    <text x="160" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">セメント</text>
    <text x="160" y="175" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">1</text>
    
    <!-- Plus Sign -->
    <text x="250" y="165" font-size="24" font-weight="bold" text-anchor="middle" fill="#34495e">+</text>
    
    <!-- Sand Parts -->
    <rect x="300" y="120" width="120" height="80" fill="#f39c12" stroke="#34495e" stroke-width="2"/>
    <text x="360" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">砂</text>
    <text x="360" y="175" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">1</text>
    
    <text x="450" y="165" font-size="24" font-weight="bold" text-anchor="middle" fill="#34495e">+</text>
    
    <rect x="500" y="120" width="120" height="80" fill="#f39c12" stroke="#34495e" stroke-width="2"/>
    <text x="560" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">砂</text>
    <text x="560" y="175" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">2</text>
    
    <!-- Total -->
    <text x="400" y="225" font-size="14" text-anchor="middle" fill="#34495e">
      合計容積比: 1 + 3 = 4
    </text>
  </g>
  
  <!-- Calculation Section -->
  <g id="calculation">
    <rect x="50" y="260" width="700" height="220" fill="#fff" stroke="#3498db" stroke-width="2" rx="5"/>
    
    <text x="400" y="290" font-size="16" font-weight="bold" text-anchor="middle" fill="#3498db">
      セメント使用量の計算
    </text>
    
    <!-- Given Information -->
    <g id="given">
      <text x="80" y="320" font-size="14" fill="#2c3e50">● モルタル体積: 1.8 m³</text>
      <text x="80" y="345" font-size="14" fill="#2c3e50">● 配合比: セメント1 : 砂3</text>
      <text x="80" y="370" font-size="14" fill="#2c3e50">● セメント比重: 3.15</text>
    </g>
    
    <!-- Calculation Steps -->
    <g id="steps">
      <rect x="400" y="305" width="340" height="160" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="3"/>
      
      <text x="420" y="330" font-size="13" fill="#2c3e50" font-weight="bold">計算手順:</text>
      
      <text x="420" y="355" font-size="12" fill="#2c3e50">
        ① セメント容積 = 1.8 m³ × (1/4) = 0.45 m³
      </text>
      
      <text x="420" y="380" font-size="12" fill="#2c3e50">
        ② セメント質量 = 0.45 m³ × 3.15 t/m³
      </text>
      
      <text x="420" y="405" font-size="12" fill="#2c3e50">
                      = 1.4175 t
      </text>
      
      <text x="420" y="430" font-size="12" fill="#2c3e50">
                      ≒ 1.42 t
      </text>
      
      <rect x="420" y="440" width="300" height="18" fill="#27ae60" rx="2"/>
      <text x="570" y="453" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
        答え: 1.42 t (または 1420 kg)
      </text>
    </g>
  </g>
</svg>