<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="400" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    重機の安全管理
  </text>
  
  <!-- 車両系建設機械 -->
  <g id="excavator">
    <!-- 本体 -->
    <rect x="100" y="200" width="120" height="80" fill="#ffd700" stroke="#333" stroke-width="2"/>
    <!-- キャブ -->
    <rect x="140" y="160" width="60" height="40" fill="#ffd700" stroke="#333" stroke-width="2"/>
    <!-- ブーム -->
    <line x1="180" y1="180" x2="250" y2="140" stroke="#333" stroke-width="8"/>
    <!-- アーム -->
    <line x1="250" y1="140" x2="290" y2="160" stroke="#333" stroke-width="6"/>
    <!-- バケット -->
    <path d="M290 160 L300 170 L295 180 L285 175 Z" fill="#666" stroke="#333" stroke-width="2"/>
    <!-- クローラ -->
    <rect x="95" y="280" width="130" height="20" rx="10" fill="#333"/>
    
    <!-- 安全表示 -->
    <circle cx="160" cy="230" r="15" fill="#ff4444"/>
    <text x="160" y="235" font-size="16" font-weight="bold" text-anchor="middle" fill="white">!</text>
    
    <text x="160" y="330" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">
      車両系建設機械
    </text>
  </g>
  
  <!-- 安全管理項目 -->
  <g id="safety-items">
    <!-- 1. 作業範囲の明示 -->
    <rect x="350" y="100" width="400" height="80" fill="white" stroke="#3498db" stroke-width="2"/>
    <circle cx="370" cy="130" r="12" fill="#3498db"/>
    <text x="385" y="135" font-size="16" font-weight="bold" fill="#2c3e50">1. 作業範囲の明示</text>
    <text x="385" y="160" font-size="14" fill="#555">・作業区域をロープ等で明示</text>
    
    <!-- 2. 誘導者の配置 -->
    <rect x="350" y="200" width="400" height="80" fill="white" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="370" cy="230" r="12" fill="#e74c3c"/>
    <text x="385" y="235" font-size="16" font-weight="bold" fill="#2c3e50">2. 誘導者の配置</text>
    <text x="385" y="260" font-size="14" fill="#555">・運転者と誘導者の連絡方法を定める</text>
    
    <!-- 3. 合図の統一 -->
    <rect x="350" y="300" width="400" height="80" fill="white" stroke="#2ecc71" stroke-width="2"/>
    <circle cx="370" cy="330" r="12" fill="#2ecc71"/>
    <text x="385" y="335" font-size="16" font-weight="bold" fill="#2c3e50">3. 合図の統一</text>
    <text x="385" y="360" font-size="14" fill="#555">・合図を統一し、運転者に周知</text>
    
    <!-- 4. 制限速度 -->
    <rect x="350" y="400" width="400" height="80" fill="white" stroke="#f39c12" stroke-width="2"/>
    <circle cx="370" cy="430" r="12" fill="#f39c12"/>
    <text x="385" y="435" font-size="16" font-weight="bold" fill="#2c3e50">4. 制限速度</text>
    <text x="385" y="460" font-size="14" fill="#555">・場内制限速度は工事計画により定める</text>
  </g>
  
  <!-- 誘導者のイラスト -->
  <g id="guide-person">
    <!-- 頭 -->
    <circle cx="100" cy="420" r="12" fill="#ffc0cb"/>
    <!-- ヘルメット -->
    <path d="M88 416 Q100 408 112 416" fill="#ff4444" stroke="#333" stroke-width="1"/>
    <!-- 体 -->
    <rect x="90" y="432" width="20" height="35" fill="#ff6600"/>
    <!-- 腕（旗を持つ） -->
    <line x1="90" y1="440" x2="70" y2="430" stroke="#ffc0cb" stroke-width="4"/>
    <line x1="110" y1="440" x2="130" y2="430" stroke="#ffc0cb" stroke-width="4"/>
    <!-- 旗 -->
    <rect x="130" y="420" width="25" height="18" fill="#ff0000"/>
    <line x1="130" y1="420" x2="130" y2="450" stroke="#333" stroke-width="2"/>
    <!-- 脚 -->
    <line x1="95" y1="467" x2="90" y2="490" stroke="#333" stroke-width="4"/>
    <line x1="105" y1="467" x2="110" y2="490" stroke="#333" stroke-width="4"/>
  </g>
  
  <!-- 注記 -->
  <text x="400" y="560" font-size="12" text-anchor="middle" fill="#666">
    ※ 車両系建設機械の安全管理は、労働安全衛生法に基づき実施
  </text>
</svg>