<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">建設機械の特性と適用</text>
  
  <!-- バックホウ -->
  <g id="backhoe">
    <text x="100" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3498db">バックホウ</text>
    
    <!-- 機械本体 -->
    <rect x="30" y="80" width="60" height="40" fill="#f39c12" rx="3"/>
    <circle cx="50" cy="130" r="12" fill="#2c3e50"/>
    <circle cx="70" cy="130" r="12" fill="#2c3e50"/>
    
    <!-- アーム -->
    <line x1="90" y1="90" x2="120" y2="110" stroke="#34495e" stroke-width="6"/>
    <line x1="120" y1="110" x2="140" y2="135" stroke="#34495e" stroke-width="5"/>
    
    <!-- バケット -->
    <path d="M 140 135 L 155 145 L 150 150 L 138 142 Z" fill="#7f8c8d" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- 掘削部分 -->
    <rect x="20" y="145" width="140" height="60" fill="#d4a574" stroke="#8b6f47" stroke-width="2"/>
    <path d="M 60 145 L 100 175 L 120 175 L 160 145" fill="#e8dcc8" stroke="#8b6f47" stroke-width="2"/>
    
    <text x="100" y="235" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">機械位置より低い場所</text>
    <text x="100" y="252" font-family="Arial, sans-serif" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">✓ 適している</text>
  </g>
  
  <!-- ブルドーザ -->
  <g id="bulldozer">
    <text x="320" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#e67e22">ブルドーザ</text>
    
    <!-- 機械本体 -->
    <rect x="230" y="85" width="80" height="35" fill="#f39c12" rx="3"/>
    <!-- クローラ -->
    <rect x="225" y="120" width="90" height="15" fill="#2c3e50" rx="2"/>
    
    <!-- ブレード -->
    <rect x="225" y="95" width="5" height="25" fill="#34495e"/>
    <rect x="205" y="95" width="20" height="30" fill="#7f8c8d" stroke="#34495e" stroke-width="2"/>
    
    <!-- 作業イメージ -->
    <path d="M 230 140 L 340 140 L 340 160 L 230 160 Z" fill="#d4a574" stroke="#8b6f47" stroke-width="2"/>
    <path d="M 230 160 L 310 170 L 340 160" fill="#d4a574" stroke="#8b6f47" stroke-width="2"/>
    
    <text x="270" y="200" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">掘削・運搬・盛土</text>
    <text x="270" y="217" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">整地など万能</text>
  </g>
  
  <!-- モータグレーダ -->
  <g id="motor_grader">
    <text x="520" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#9b59b6">モータグレーダ</text>
    
    <!-- 機械本体 -->
    <rect x="450" y="85" width="90" height="30" fill="#f39c12" rx="3"/>
    <!-- タイヤ -->
    <circle cx="465" cy="125" r="10" fill="#2c3e50"/>
    <circle cx="490" cy="125" r="10" fill="#2c3e50"/>
    <circle cx="515" cy="125" r="10" fill="#2c3e50"/>
    
    <!-- ブレード（中央下部） -->
    <rect x="475" y="108" width="40" height="4" fill="#7f8c8d" stroke="#34495e" stroke-width="1"/>
    
    <!-- 路盤 -->
    <rect x="440" y="135" width="120" height="8" fill="#95a5a6"/>
    <path d="M 440 143 L 560 143 L 555 150 L 445 150 Z" fill="#bdc3c7"/>
    
    <text x="500" y="175" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">路盤の整形・</text>
    <text x="500" y="192" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">仕上げに特化</text>
  </g>
  
  <!-- クラムシェル -->
  <g id="clamshell">
    <text x="100" y="290" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#16a085">クラムシェル</text>
    
    <!-- クレーン本体 -->
    <rect x="50" y="315" width="40" height="50" fill="#f39c12" rx="3"/>
    
    <!-- ワイヤー -->
    <line x1="70" y1="315" x2="70" y2="400" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- クラムシェルバケット（開） -->
    <path d="M 60 395 L 55 410 L 70 410 Z" fill="#7f8c8d" stroke="#34495e" stroke-width="2"/>
    <path d="M 80 395 L 85 410 L 70 410 Z" fill="#7f8c8d" stroke="#34495e" stroke-width="2"/>
    
    <!-- 水中・軟弱地盤 -->
    <rect x="30" y="410" width="120" height="50" fill="#85c1e9" opacity="0.6"/>
    <text x="90" y="440" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">軟弱土・水中</text>
    
    <rect x="30" y="470" width="120" height="15" fill="#d4a574"/>
    
    <text x="90" y="250" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">軟弱地盤・水中</text>
    <text x="90" y="267" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="bold" text-anchor="middle">✓ 適している</text>
  </g>
  
  <!-- 油圧ブレーカ（岩盤用） -->
  <g id="hydraulic_breaker">
    <text x="380" y="290" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#c0392b">油圧ブレーカ</text>
    
    <!-- バックホウ本体 -->
    <rect x="300" y="320" width="50" height="30" fill="#f39c12" rx="3"/>
    
    <!-- アーム -->
    <line x1="350" y1="330" x2="380" y2="350" stroke="#34495e" stroke-width="5"/>
    <line x1="380" y1="350" x2="400" y2="385" stroke="#34495e" stroke-width="4"/>
    
    <!-- ブレーカ -->
    <rect x="397" y="385" width="6" height="30" fill="#95a5a6" stroke="#34495e" stroke-width="2"/>
    <path d="M 400 415 L 395 425 L 405 425 Z" fill="#7f8c8d" stroke="#34495e" stroke-width="2"/>
    
    <!-- 岩盤 -->
    <rect x="280" y="425" width="180" height="60" fill="#5d6d7e" stroke="#2c3e50" stroke-width="2"/>
    <text x="370" y="460" font-family="Arial, sans-serif" font-size="14" fill="#ecf0f1" font-weight="bold" text-anchor="middle">硬い岩盤</text>
    
    <!-- 破砕 -->
    <path d="M 390 418 L 395 425 L 385 425 Z" fill="#e74c3c"/>
    
    <text x="370" y="265" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">硬い岩盤の破砕</text>
    <text x="370" y="282" font-family="Arial, sans-serif" font-size="11" fill="#c0392b" font-weight="bold" text-anchor="middle">クラムシェルは不向き</text>
  </g>
  
  <!-- 重要ポイント -->
  <rect x="520" y="310" width="250" height="175" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="645" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d68910" text-anchor="middle">【重要ポイント】</text>
  
  <text x="535" y="360" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">バックホウ</text>
  <text x="545" y="377" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">→ 機械より低い場所</text>
  
  <text x="535" y="402" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">ブルドーザ</text>
  <text x="545" y="419" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">→ 万能機械</text>
  
  <text x="535" y="444" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">クラムシェル</text>
  <text x="545" y="461" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">→ 軟弱土・水中</text>
  <text x="545" y="475" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" font-weight="bold">→ 硬い岩盤は不可</text>
</svg>
