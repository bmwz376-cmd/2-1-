<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- 背景 -->
  <rect width="800" height="450" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">コンクリートの養生方法</text>
  
  <!-- 湿潤養生 -->
  <g id="moist_curing">
    <text x="130" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3498db">湿潤養生</text>
    
    <!-- コンクリート表面 -->
    <rect x="30" y="80" width="230" height="80" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
    
    <!-- 散水 -->
    <path d="M 60 65 Q 55 70 55 75" stroke="#3498db" stroke-width="2" fill="none"/>
    <path d="M 90 65 Q 85 70 85 75" stroke="#3498db" stroke-width="2" fill="none"/>
    <path d="M 120 65 Q 115 70 115 75" stroke="#3498db" stroke-width="2" fill="none"/>
    <path d="M 150 65 Q 145 70 145 75" stroke="#3498db" stroke-width="2" fill="none"/>
    <path d="M 180 65 Q 175 70 175 75" stroke="#3498db" stroke-width="2" fill="none"/>
    <path d="M 210 65 Q 205 70 205 75" stroke="#3498db" stroke-width="2" fill="none"/>
    <path d="M 240 65 Q 235 70 235 75" stroke="#3498db" stroke-width="2" fill="none"/>
    
    <!-- 水分 -->
    <rect x="30" y="70" width="230" height="10" fill="#4da6ff" opacity="0.5"/>
    
    <text x="145" y="125" font-family="Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">湿った状態を保つ</text>
    
    <rect x="30" y="175" width="230" height="60" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="3"/>
    <text x="145" y="195" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">【方法】</text>
    <text x="145" y="213" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">散水、養生マット、</text>
    <text x="145" y="228" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">養生シート等</text>
  </g>
  
  <!-- 普通ポルトランドセメント -->
  <g id="normal_cement">
    <text x="420" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#27ae60">普通ポルトランドセメント</text>
    
    <!-- カレンダー -->
    <rect x="290" y="85" width="260" height="150" fill="#fff" stroke="#95a5a6" stroke-width="2" rx="5"/>
    
    <!-- 温度条件 -->
    <text x="420" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50" text-anchor="middle">日平均気温15℃以上</text>
    
    <!-- 養生期間 -->
    <rect x="310" y="125" width="220" height="35" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="3"/>
    <text x="420" y="148" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60" text-anchor="middle">標準養生期間：5日間</text>
    
    <!-- カレンダー表示 -->
    <g id="calendar">
      <text x="320" y="185" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1日</text>
      <rect x="345" y="170" width="25" height="20" fill="#27ae60" opacity="0.3"/>
      <text x="352" y="185" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">2</text>
      <rect x="375" y="170" width="25" height="20" fill="#27ae60" opacity="0.3"/>
      <text x="382" y="185" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">3</text>
      <rect x="405" y="170" width="25" height="20" fill="#27ae60" opacity="0.3"/>
      <text x="412" y="185" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">4</text>
      <rect x="435" y="170" width="25" height="20" fill="#27ae60" opacity="0.3"/>
      <text x="442" y="185" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">5</text>
      <rect x="465" y="170" width="25" height="20" fill="#fff" stroke="#95a5a6"/>
      <text x="472" y="185" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d" text-anchor="middle">6</text>
    </g>
    
    <text x="420" y="215" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" text-anchor="middle">※気温が低い場合は延長が必要</text>
  </g>
  
  <!-- 寒中コンクリート -->
  <g id="cold_weather">
    <text x="130" y="270" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3498db">寒中コンクリート</text>
    
    <rect x="30" y="290" width="230" height="120" fill="#d6eaf8" stroke="#3498db" stroke-width="2" rx="5"/>
    
    <!-- 温度計 -->
    <rect x="50" y="310" width="15" height="60" fill="#fff" stroke="#2c3e50" stroke-width="1" rx="2"/>
    <circle cx="57.5" cy="380" r="10" fill="#3498db"/>
    <text x="57.5" y="385" font-family="Arial, sans-serif" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">0°</text>
    
    <text x="130" y="330" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">保温養生が必要</text>
    <text x="85" y="355" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• 初期凍害を防ぐ</text>
    <text x="85" y="375" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• 保温シート使用</text>
    <text x="85" y="395" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• 速やかに保温開始</text>
  </g>
  
  <!-- 暑中コンクリート -->
  <g id="hot_weather">
    <text x="420" y="270" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#e74c3c">暑中コンクリート</text>
    
    <rect x="290" y="290" width="260" height="120" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="5"/>
    
    <!-- 温度計 -->
    <rect x="310" y="310" width="15" height="60" fill="#fff" stroke="#2c3e50" stroke-width="1" rx="2"/>
    <rect x="313" y="320" width="9" height="45" fill="#e74c3c"/>
    <circle cx="317.5" cy="380" r="10" fill="#e74c3c"/>
    <text x="317.5" y="385" font-family="Arial, sans-serif" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">35°</text>
    
    <text x="410" y="325" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">積極的な散水が必要</text>
    <text x="345" y="350" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• 急激な乾燥を防ぐ</text>
    <text x="345" y="370" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• こまめに散水</text>
    <text x="345" y="390" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c" font-weight="bold">• 散水を控えるのは誤り！</text>
  </g>
</svg>
