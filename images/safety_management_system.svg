<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #34495e; }
      .value { font-family: Arial, sans-serif; font-size: 14px; fill: #e74c3c; font-weight: bold; }
      .box { fill: #3498db; stroke: #2c3e50; stroke-width: 2; }
      .box-manager { fill: #e74c3c; stroke: #2c3e50; stroke-width: 2; }
      .box-committee { fill: #27ae60; stroke: #2c3e50; stroke-width: 2; }
      .arrow { fill: none; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">安全衛生管理体制</text>
  
  <!-- Top Level: General Manager -->
  <g transform="translate(250, 60)">
    <rect class="box-manager" x="0" y="0" width="300" height="60" rx="5"/>
    <text x="150" y="30" class="subtitle" text-anchor="middle" fill="white">総括安全衛生管理者</text>
    <text x="150" y="48" class="label" text-anchor="middle" fill="white">常時100人以上（建設業）</text>
  </g>
  
  <!-- Arrows down -->
  <path class="arrow" d="M 300 120 L 300 160"/>
  <path class="arrow" d="M 500 120 L 500 160"/>
  
  <!-- Second Level: Managers -->
  <g transform="translate(100, 160)">
    <rect class="box" x="0" y="0" width="180" height="60" rx="5"/>
    <text x="90" y="30" class="subtitle" text-anchor="middle" fill="white">安全管理者</text>
    <text x="90" y="48" class="label" text-anchor="middle" fill="white">50人以上</text>
  </g>
  
  <g transform="translate(520, 160)">
    <rect class="box" x="0" y="0" width="180" height="60" rx="5"/>
    <text x="90" y="30" class="subtitle" text-anchor="middle" fill="white">衛生管理者</text>
    <text x="90" y="48" class="label" text-anchor="middle" fill="white">50人以上</text>
  </g>
  
  <!-- Arrows down to committees -->
  <path class="arrow" d="M 190 220 L 190 270"/>
  <path class="arrow" d="M 610 220 L 610 270"/>
  
  <!-- Third Level: Committees -->
  <g transform="translate(60, 270)">
    <rect class="box-committee" x="0" y="0" width="260" height="80" rx="5"/>
    <text x="130" y="25" class="subtitle" text-anchor="middle" fill="white">安全委員会</text>
    <text x="130" y="48" class="label" text-anchor="middle" fill="white">50人以上</text>
    <text x="130" y="68" class="value" text-anchor="middle" fill="white">毎月1回以上開催</text>
  </g>
  
  <g transform="translate(480, 270)">
    <rect class="box-committee" x="0" y="0" width="260" height="80" rx="5"/>
    <text x="130" y="25" class="subtitle" text-anchor="middle" fill="white">衛生委員会</text>
    <text x="130" y="48" class="label" text-anchor="middle" fill="white">50人以上</text>
    <text x="130" y="68" class="value" text-anchor="middle" fill="white">毎月1回以上開催</text>
  </g>
  
  <!-- Alternative: Combined Committee -->
  <g transform="translate(250, 390)">
    <rect x="0" y="0" width="300" height="60" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="150" y="30" class="subtitle" text-anchor="middle" fill="white">安全衛生委員会</text>
    <text x="150" y="48" class="label" text-anchor="middle" fill="white">（両委員会を統合可能）</text>
  </g>
  
  <!-- Important Notes -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="700" height="100" fill="#fff3cd" stroke="#f39c12" stroke-width="3" rx="5"/>
    <text x="20" y="30" class="label" font-weight="bold" fill="#856404">【重要ポイント】</text>
    <text x="20" y="52" class="label" fill="#856404">• 安全委員会・衛生委員会は「毎月」1回以上開催（毎年ではない！）</text>
    <text x="20" y="72" class="label" fill="#856404">• 総括安全衛生管理者：建設業では常時100人以上の事業場で選任</text>
    <text x="20" y="92" class="label" fill="#856404">• 安全管理者・衛生管理者：常時50人以上の事業場で選任</text>
  </g>
</svg>