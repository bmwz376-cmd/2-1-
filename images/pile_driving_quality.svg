<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Title -->
  <text x="400" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    杭打ち工における品質管理項目
  </text>
  
  <!-- Ground Level Line -->
  <line x1="50" y1="150" x2="750" y2="150" stroke="#8b4513" stroke-width="3"/>
  <text x="400" y="140" font-size="12" text-anchor="middle" fill="#8b4513" font-weight="bold">
    地表面 (Ground Level)
  </text>
  
  <!-- Soil Layers -->
  <rect x="50" y="150" width="700" height="80" fill="#deb887" opacity="0.5"/>
  <text x="720" y="190" font-size="11" fill="#8b4513">軟弱層</text>
  
  <rect x="50" y="230" width="700" height="60" fill="#cd853f" opacity="0.5"/>
  <text x="720" y="260" font-size="11" fill="#8b4513">中間層</text>
  
  <rect x="50" y="290" width="700" height="100" fill="#a0522d" opacity="0.7"/>
  <text x="720" y="340" font-size="11" fill="#8b4513">支持層</text>
  
  <!-- Pile Diagram -->
  <g id="pile">
    <!-- Pile body -->
    <rect x="350" y="80" width="100" height="310" fill="#95a5a6" stroke="#34495e" stroke-width="3"/>
    
    <!-- Pile head -->
    <rect x="340" y="80" width="120" height="30" fill="#7f8c8d" stroke="#34495e" stroke-width="2"/>
    <text x="400" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">杭頭</text>
    
    <!-- Pile tip -->
    <path d="M 350 390 L 400 430 L 450 390 Z" fill="#7f8c8d" stroke="#34495e" stroke-width="2"/>
    
    <!-- Pile labels -->
    <text x="400" y="240" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
      コンクリート杭
    </text>
  </g>
  
  <!-- Quality Control Items with Arrows -->
  <g id="quality-items">
    <!-- Item 1: Pile Position -->
    <g id="position">
      <circle cx="150" cy="95" r="8" fill="#e74c3c"/>
      <line x1="158" y1="95" x2="340" y2="95" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
      <rect x="50" y="60" width="90" height="50" fill="#ffe6e6" stroke="#e74c3c" stroke-width="2" rx="3"/>
      <text x="95" y="80" font-size="11" font-weight="bold" text-anchor="middle" fill="#e74c3c">杭の位置</text>
      <text x="95" y="97" font-size="9" text-anchor="middle" fill="#c0392b">(Pile Position)</text>
    </g>
    
    <!-- Item 2: Verticality -->
    <g id="verticality">
      <circle cx="250" cy="95" r="8" fill="#3498db"/>
      <line x1="258" y1="95" x2="340" y2="95" stroke="#3498db" stroke-width="2" marker-end="url(#arrowBlue)"/>
      <rect x="155" y="60" width="90" height="50" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="3"/>
      <text x="200" y="80" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">杭の鉛直度</text>
      <text x="200" y="97" font-size="9" text-anchor="middle" fill="#2980b9">(Verticality)</text>
    </g>
    
    <!-- Item 3: Bearing Layer -->
    <g id="bearing">
      <circle cx="550" cy="340" r="8" fill="#27ae60"/>
      <line x1="542" y1="340" x2="450" y2="340" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowGreen)"/>
      <rect x="560" y="315" width="110" height="50" fill="#e8f8f0" stroke="#27ae60" stroke-width="2" rx="3"/>
      <text x="615" y="333" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">支持層への</text>
      <text x="615" y="347" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">到達深さ</text>
      <text x="615" y="360" font-size="9" text-anchor="middle" fill="#229954">(Penetration Depth)</text>
    </g>
    
    <!-- Item 4: NOT Required (Placement Method) -->
    <g id="not-required">
      <rect x="50" y="470" width="700" height="70" fill="#ffe6e6" stroke="#e74c3c" stroke-width="3" rx="5"/>
      <circle cx="90" cy="505" r="20" fill="#e74c3c"/>
      <text x="90" y="513" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">✗</text>
      
      <text x="130" y="495" font-size="14" font-weight="bold" fill="#c0392b">
        杭の打込み方法 ← これは品質管理項目ではない！
      </text>
      <text x="130" y="515" font-size="12" fill="#c0392b">
        打込み方法は「施工方法」の選択であり、「品質管理」の検査項目ではありません。
      </text>
      <text x="130" y="532" font-size="11" fill="#c0392b">
        品質管理では「結果」(位置、鉛直度、深さ等)を検査します。
      </text>
    </g>
  </g>
  
  <!-- Arrow Markers -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/>
    </marker>
  </defs>
</svg>