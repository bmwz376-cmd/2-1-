<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">排水工法の比較</text>
  
  <!-- 釜場排水 -->
  <g id="kamaba">
    <text x="130" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">釜場排水</text>
    <!-- 地盤 -->
    <rect x="20" y="80" width="220" height="150" fill="#d4a574" stroke="#8b6f47" stroke-width="2"/>
    <!-- 掘削部 -->
    <path d="M 60 80 L 120 150 L 180 150 L 240 80" fill="#e8dcc8" stroke="#8b6f47" stroke-width="2"/>
    <!-- 水 -->
    <path d="M 120 150 L 180 150 L 180 180 L 120 180 Z" fill="#4da6ff" opacity="0.6"/>
    <!-- 集水ピット -->
    <rect x="140" y="180" width="20" height="30" fill="#2980b9" stroke="#1a5490" stroke-width="2"/>
    <!-- ポンプ -->
    <circle cx="150" cy="195" r="8" fill="#e74c3c"/>
    <line x1="150" y1="187" x2="150" y2="150" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="130" y="245" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">集水ピット</text>
  </g>
  
  <!-- ウェルポイント -->
  <g id="wellpoint">
    <text x="370" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3498db">ウェルポイント</text>
    <!-- 地盤 -->
    <rect x="270" y="80" width="220" height="150" fill="#d4a574" stroke="#8b6f47" stroke-width="2"/>
    <!-- 掘削部 -->
    <path d="M 310 80 L 350 120 L 410 120 L 450 80" fill="#e8dcc8" stroke="#8b6f47" stroke-width="2"/>
    <!-- 元の地下水位 -->
    <line x1="270" y1="140" x2="490" y2="140" stroke="#4da6ff" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="495" y="145" font-family="Arial, sans-serif" font-size="11" fill="#4da6ff">元の水位</text>
    <!-- 低下後の水位 -->
    <line x1="270" y1="180" x2="490" y2="180" stroke="#27ae60" stroke-width="2"/>
    <text x="495" y="185" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">低下後</text>
    <!-- ウェルポイント -->
    <line x1="290" y1="80" x2="290" y2="210" stroke="#2980b9" stroke-width="3"/>
    <line x1="330" y1="80" x2="330" y2="210" stroke="#2980b9" stroke-width="3"/>
    <line x1="380" y1="80" x2="380" y2="210" stroke="#2980b9" stroke-width="3"/>
    <line x1="430" y1="80" x2="430" y2="210" stroke="#2980b9" stroke-width="3"/>
    <line x1="470" y1="80" x2="470" y2="210" stroke="#2980b9" stroke-width="3"/>
    <!-- ヘッダーパイプ -->
    <line x1="270" y1="70" x2="490" y2="70" stroke="#e74c3c" stroke-width="4"/>
    <text x="330" y="250" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">真空ポンプで吸引</text>
  </g>
  
  <!-- ディープウェル -->
  <g id="deepwell">
    <text x="620" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9b59b6">ディープウェル</text>
    <!-- 地盤 -->
    <rect x="520" y="80" width="220" height="300" fill="#d4a574" stroke="#8b6f47" stroke-width="2"/>
    <!-- 掘削部 -->
    <path d="M 560 80 L 600 120 L 660 120 L 700 80" fill="#e8dcc8" stroke="#8b6f47" stroke-width="2"/>
    <!-- 透水層 -->
    <rect x="520" y="200" width="220" height="100" fill="#85c1e9" opacity="0.5"/>
    <text x="590" y="245" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">被圧地下水層</text>
    <!-- 元の地下水位 -->
    <line x1="520" y1="150" x2="740" y2="150" stroke="#4da6ff" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="745" y="155" font-family="Arial, sans-serif" font-size="11" fill="#4da6ff">元の水位</text>
    <!-- 低下後の水位 -->
    <line x1="520" y1="190" x2="740" y2="190" stroke="#27ae60" stroke-width="2"/>
    <text x="745" y="195" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">低下後</text>
    <!-- ディープウェル -->
    <line x1="570" y1="80" x2="570" y2="350" stroke="#8e44ad" stroke-width="5"/>
    <circle cx="570" cy="250" r="15" fill="none" stroke="#8e44ad" stroke-width="3"/>
    <line x1="650" y1="80" x2="650" y2="350" stroke="#8e44ad" stroke-width="5"/>
    <circle cx="650" cy="250" r="15" fill="none" stroke="#8e44ad" stroke-width="3"/>
    <!-- 水中ポンプ -->
    <rect x="563" y="240" width="14" height="20" fill="#e74c3c" rx="2"/>
    <rect x="643" y="240" width="14" height="20" fill="#e74c3c" rx="2"/>
    <text x="590" y="410" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">深い地下水に対応</text>
  </g>
  
  <!-- 凡例 -->
  <g id="legend">
    <text x="50" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">【特徴】</text>
    <text x="50" y="320" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• 釜場排水: 最も簡便、浅い掘削向き</text>
    <text x="50" y="340" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• ウェルポイント: 浅い地下水（5～6m）</text>
    <text x="50" y="360" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• ディープウェル: 深い地下水・被圧水</text>
  </g>
  
  <!-- 矢印マーカー定義 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>
</svg>
